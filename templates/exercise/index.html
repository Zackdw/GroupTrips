<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Exercise</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/survey-core@3.2.1/survey-core.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg: #f7f5f0; --fg: #1f2328; --muted: #5f6670; --accent: #0b7a75; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16181b; --fg: #e8e6e3; --muted: #9aa0a6; --accent: #3fb8b0; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .intro { color: var(--muted); margin: 0 0 20px; }
  #map-section { margin-bottom: 24px; }
  #map { height: 360px; border-radius: 10px; }
  .hint { font-size: .9rem; color: var(--muted); margin: 6px 0 0; }
  #status { margin-top: 16px; font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="intro" id="intro"></p>

  <section id="map-section" hidden>
    <div id="map"></div>
    <p class="hint">Tap the map to drop a pin. Tap a pin to remove it.</p>
  </section>

  <div id="survey"></div>
  <p id="status" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/survey-core@3.2.1/survey.core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/survey-js-ui@3.2.1/survey-js-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Configure per exercise ──────────────────────────────────────────────
const TRIP = 'YYYY-MM-place';
const EXERCISE = 'exercise-name';          // becomes the Sheet tab name
const ENDPOINT = '';                        // Apps Script /exec URL (see TOOLS.md)
const TITLE = 'Exercise title';
const INTRO = 'One or two sentences on what this is and why it matters. Takes ~3 min.';

// Set to null for no map. Pins are submitted as answers.pins.
const MAP = { center: [20.8, -156.3], zoom: 7 };

// SurveyJS form definition — https://surveyjs.io/form-library/examples/overview
const SURVEY = {
  showQuestionNumbers: 'off',
  completeText: 'Send',
  pages: [{
    elements: [
      { type: 'text', name: 'name', title: 'Your first name', isRequired: true },
      { type: 'ranking', name: 'priorities', title: 'Drag to rank',
        choices: ['Beaches', 'Hiking', 'Food', 'Nightlife', 'Downtime'] },
      { type: 'comment', name: 'notes', title: 'Anything else?' }
    ]
  }]
};
// ────────────────────────────────────────────────────────────────────────

document.title = TITLE;
document.getElementById('title').textContent = TITLE;
document.getElementById('intro').textContent = INTRO;
const status = document.getElementById('status');

const pins = [];
if (MAP) {
  document.getElementById('map-section').hidden = false;
  const map = L.map('map').setView(MAP.center, MAP.zoom);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  map.on('click', (e) => {
    const pin = { lat: +e.latlng.lat.toFixed(5), lng: +e.latlng.lng.toFixed(5) };
    const marker = L.marker(e.latlng).addTo(map);
    pins.push(pin);
    marker.on('click', () => { map.removeLayer(marker); pins.splice(pins.indexOf(pin), 1); });
  });
}

const survey = new Survey.Model(SURVEY);
survey.onComplete.add(async (sender) => {
  const answers = Object.assign({}, sender.data, MAP ? { pins } : {});
  if (!ENDPOINT) {
    console.log('No ENDPOINT set; would have sent:', answers);
    status.textContent = 'Preview mode: answers logged to the console, not sent.';
    return;
  }
  status.textContent = 'Sending…';
  try {
    // text/plain + no-cors avoids a CORS preflight, which Apps Script doesn't answer.
    await fetch(ENDPOINT, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ trip: TRIP, exercise: EXERCISE, answers })
    });
    status.textContent = 'Got it, thanks! 🤙';
  } catch (err) {
    status.textContent = 'Couldn\'t send. Screenshot your answers and drop them in the group chat.';
  }
});
survey.render(document.getElementById('survey'));
</script>
</body>
</html>
